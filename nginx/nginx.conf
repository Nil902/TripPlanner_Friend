# NGINX API Gateway Configuration
# Serves as the single unified entrypoint matching systemArchitectureImage.jpg

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings — includes rate-limit key for observability
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------------------
    # Rate Limiting Zones
    # ---------------------------------------------------------------------------

    # Zone 1 — General API protection (IP-based, 15 req/s)
    # Applied to all /api/ routes as a baseline guard.
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;

    # Zone 2 — AI endpoint per-user protection (user-keyed, 5 req/min)
    # Key: SHA-1 hash of the Authorization header value (the JWT bearer token).
    # This ties the limit to the authenticated identity, not just the source IP,
    # so one user behind NAT cannot exhaust the quota for others.
    # Falls back to the raw header string when $binary_remote_addr key space
    # is sufficient; nginx hashes it internally for the shared memory zone.
    # 5 req/min ≈ 1 plan generation or AI ask every ~12 seconds per user.
    limit_req_zone $http_authorization zone=ai_user_limit:20m rate=5r/m;

    # Return 429 Too Many Requests (RFC 6585) instead of nginx default 503
    limit_req_status 429;

    # Upstream Definitions
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_spa {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body limit for expense receipts / payloads
        client_max_body_size 16M;

        # -----------------------------------------------------------------------
        # AI-heavy endpoints — dual rate limit (per-user strict + per-IP general)
        # These routes call the LLM (Gemini) and are the most expensive to abuse.
        # -----------------------------------------------------------------------

        # Generate itinerary (triggers full Propose-Validate-Rebalance agent loop)
        location ~ ^/api/v1/trips/[^/]+/plan$ {
            limit_req zone=ai_user_limit burst=2 nodelay;
            limit_req zone=api_rate_limit burst=10 nodelay;

            add_header Retry-After 12 always;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeout: agent loop can take up to 2 minutes
            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # Natural-language plan refinement (calls LLM + re-runs planning loop)
        location ~ ^/api/v1/trips/[^/]+/plan/refine$ {
            limit_req zone=ai_user_limit burst=2 nodelay;
            limit_req zone=api_rate_limit burst=10 nodelay;

            add_header Retry-After 12 always;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # Open-ended AI Q&A about the destination / itinerary
        location ~ ^/api/v1/trips/[^/]+/plan/ask$ {
            limit_req zone=ai_user_limit burst=3 nodelay;
            limit_req zone=api_rate_limit burst=10 nodelay;

            add_header Retry-After 12 always;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # Dynamic rebalance (disruption recovery — re-runs agent on affected slice)
        location ~ ^/api/v1/trips/[^/]+/rebalance$ {
            limit_req zone=ai_user_limit burst=2 nodelay;
            limit_req zone=api_rate_limit burst=10 nodelay;

            add_header Retry-After 12 always;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # -----------------------------------------------------------------------
        # General API endpoints — IP-based rate limit only
        # -----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_rate_limit burst=25 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for longer agent loop generation calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Healthcheck endpoint
        location /healthz {
            proxy_pass http://backend_api/healthz;
            proxy_set_header Host $host;
        }

        # Interactive API Documentation
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_set_header Host $host;
        }

        # Frontend Client (React SPA)
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

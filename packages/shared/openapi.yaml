openapi: 3.1.0
info:
  title: Autonomous Travel & Group Itinerary Coordinator
  description: Agentic planning, validation, dynamic rebalancing, and expense settle-up.
  version: 1.0.0
paths:
  /api/v1/auth/signup:
    post:
      tags:
      - Authentication
      summary: Signup
      description: Register a new user account with email and password.
      operationId: signup_api_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: Login
      description: Authenticate user credentials and return bearer token.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get Me
      description: Retrieve currently authenticated user profile.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
      security:
      - HTTPBearer: []
  /api/v1/admin/login:
    post:
      tags:
      - Platform Administration
      summary: Admin Login
      description: Authenticate administrator credentials and return bearer token.
      operationId: admin_login_api_v1_admin_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/overview:
    get:
      tags:
      - Platform Administration
      summary: Get Admin Overview
      description: Retrieve platform KPI metrics.
      operationId: get_admin_overview_api_v1_admin_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/admin/trips:
    get:
      tags:
      - Platform Administration
      summary: List Admin Trips
      description: List all trips on the platform with creator details and member
        counts.
      operationId: list_admin_trips_api_v1_admin_trips_get
      security:
      - HTTPBearer: []
      parameters:
      - name: query
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminTripItem'
                title: Response List Admin Trips Api V1 Admin Trips Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/trips/{trip_id}/status:
    patch:
      tags:
      - Platform Administration
      summary: Update Trip Status
      description: Update trip moderation status (active, flagged, closed).
      operationId: update_trip_status_api_v1_admin_trips__trip_id__status_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/trips/{trip_id}:
    delete:
      tags:
      - Platform Administration
      summary: Delete Trip Admin
      description: Administrative force deletion of a trip with full cascade.
      operationId: delete_trip_admin_api_v1_admin_trips__trip_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Delete Trip Admin Api V1 Admin Trips  Trip Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/admin/users:
    get:
      tags:
      - Platform Administration
      summary: List Admin Users
      description: List registered user accounts and trip statistics.
      operationId: list_admin_users_api_v1_admin_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AdminUserItem'
                type: array
                title: Response List Admin Users Api V1 Admin Users Get
      security:
      - HTTPBearer: []
  /api/v1/admin/api-usage:
    get:
      tags:
      - Platform Administration
      summary: Get Api Usage
      description: External API consumption and quota tracking.
      operationId: get_api_usage_api_v1_admin_api_usage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiUsageItem'
                type: array
                title: Response Get Api Usage Api V1 Admin Api Usage Get
      security:
      - HTTPBearer: []
  /api/v1/admin/system-health:
    get:
      tags:
      - Platform Administration
      summary: Get System Health
      description: Live system diagnostics — probes DB and Redis; Nginx/LLM are inferred.
      operationId: get_system_health_api_v1_admin_system_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SystemHealthNode'
                type: array
                title: Response Get System Health Api V1 Admin System Health Get
      security:
      - HTTPBearer: []
  /api/v1/trips:
    get:
      tags:
      - Trips
      summary: List Trips
      description: List all trips.
      operationId: list_trips_api_v1_trips_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Trip'
                type: array
                title: Response List Trips Api V1 Trips Get
    post:
      tags:
      - Trips
      summary: Create Trip
      description: Create a new trip room.
      operationId: create_trip_api_v1_trips_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTripRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}:
    get:
      tags:
      - Trips
      summary: Get Trip
      description: Retrieve trip details by ID.
      operationId: get_trip_api_v1_trips__trip_id__get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Trips
      summary: Update Trip
      description: Update trip properties (destination, dates, title, status, members).
        Allows all edits.
      operationId: update_trip_api_v1_trips__trip_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: X-User-Role
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTripRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Trips
      summary: Delete Trip
      description: Delete a trip.
      operationId: delete_trip_api_v1_trips__trip_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: X-User-Role
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-User-Role
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/join:
    post:
      tags:
      - Trips
      summary: Join Trip
      description: Join a trip room as a participant without authentication.
      operationId: join_trip_api_v1_trips__trip_id__join_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTripRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/members:
    get:
      tags:
      - Trips
      summary: Get Trip Members
      description: Retrieve all members of a trip with roles, names, initials, and
        submission status.
      operationId: get_trip_members_api_v1_trips__trip_id__members_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberResponse'
                title: Response Get Trip Members Api V1 Trips  Trip Id  Members Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/permissions:
    get:
      tags:
      - Trips
      summary: Get Trip Permissions
      description: Check effective trip permissions for creator, joiner, or administrator.
      operationId: get_trip_permissions_api_v1_trips__trip_id__permissions_get
      security:
      - HTTPBearer: []
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPermissionsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/constraints:
    post:
      tags:
      - Constraints
      summary: Submit Constraint
      description: Submit or update constraints for a trip member.
      operationId: submit_constraint_api_v1_trips__trip_id__constraints_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitConstraintRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Constraint'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Constraints
      summary: List Constraints
      description: List all submitted constraints for a trip.
      operationId: list_constraints_api_v1_trips__trip_id__constraints_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Constraint'
                title: Response List Constraints Api V1 Trips  Trip Id  Constraints
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan:
    post:
      tags:
      - Plan
      summary: Generate Plan
      description: Trigger the autonomous agent propose-validate-rebalance planning
        loop.
      operationId: generate_plan_api_v1_trips__trip_id__plan_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Plan
      summary: Get Plan
      description: Get the latest plan or a specific version.
      operationId: get_plan_api_v1_trips__trip_id__plan_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Optional specific plan version
          title: Version
        description: Optional specific plan version
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/versions:
    get:
      tags:
      - Plan
      summary: List Plan Versions
      description: List all available plan versions for this trip.
      operationId: list_plan_versions_api_v1_trips__trip_id__plan_versions_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Plan Versions Api V1 Trips  Trip Id  Plan Versions
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/items:
    post:
      tags:
      - Plan
      summary: Add Plan Item
      description: Add a custom plan item to the latest plan (Always allow all edits).
      operationId: add_plan_item_api_v1_trips__trip_id__plan_items_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanItemRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/items/{item_id}:
    put:
      tags:
      - Plan
      summary: Update Plan Item
      description: Directly edit an existing itinerary stop (Always allow all edits).
      operationId: update_plan_item_api_v1_trips__trip_id__plan_items__item_id__put
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanItemRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Plan
      summary: Delete Plan Item
      description: Remove a plan item from the itinerary.
      operationId: delete_plan_item_api_v1_trips__trip_id__plan_items__item_id__delete
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          title: Item Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/validate:
    post:
      tags:
      - Plan
      summary: Validate Current Plan
      description: 'Runs deterministic validators (budget, transit, operating hours)
        on the current plan.

        Powers real-time feedback in manual mode and post-edit validations.'
      operationId: validate_current_plan_api_v1_trips__trip_id__plan_validate_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/refine:
    post:
      tags:
      - Plan
      summary: Refine Plan
      description: 'Apply natural-language refinement to the itinerary (e.g. ''Make
        Day 2 more relaxed'').

        Re-runs proposing/balancing with user instruction and creates a newly versioned
        Plan.'
      operationId: refine_plan_api_v1_trips__trip_id__plan_refine_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefinePlanRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/ask:
    post:
      tags:
      - Plan
      summary: Ask Agent
      description: 'Ask the AI agent an open-ended question about the destination
        or itinerary,

        e.g. ''Which places are the most popular to visit?'' or ''Where is the best

        seafood within our $30 lunch budget?''.


        Uses the LLM when configured; falls back to a deterministic recommendation

        otherwise. Answers are advisory only and do not modify the plan.'
      operationId: ask_agent_api_v1_trips__trip_id__plan_ask_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskAgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/plan/export.ics:
    get:
      tags:
      - Plan
      summary: Export Plan Ics
      description: 'Export the current trip plan as an RFC 5545 iCalendar (.ics) file

        compatible with Apple Calendar, Google Calendar, and Outlook.'
      operationId: export_plan_ics_api_v1_trips__trip_id__plan_export_ics_get
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/rebalance:
    post:
      tags:
      - Rebalance
      summary: Rebalance Trip
      description: 'Dynamically rebalances the itinerary in response to a disruption

        (venue closed, flight delay, weather, etc.) by isolating the affected slice

        and preserving plan version history.'
      operationId: rebalance_trip_api_v1_trips__trip_id__rebalance_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisruptionEvent'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/trips/{trip_id}/expenses:
    post:
      tags:
      - Expenses
      summary: Add Expense
      description: Log a new group expense.
      operationId: add_expense_api_v1_trips__trip_id__expenses_post
      parameters:
      - name: trip_id
        in: path
        required: true
        schema:
          type: string
          title: Trip Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:

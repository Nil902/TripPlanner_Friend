services:
  # ==============================================================================
  # DATA LAYER: PostgreSQL & Redis (per systemArchitectureImage.jpg)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: travel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-travel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-travel_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-travel_coordinator}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-travel_admin} -d ${POSTGRES_DB:-travel_coordinator}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: travel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # BACKEND SERVICE: FastAPI & Agent Planning Loop
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: travel_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-travel_admin}:${POSTGRES_PASSWORD:-travel_secure_pass}@postgres:5432/${POSTGRES_DB:-travel_coordinator}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-production-secret-token-change-me}
      CORS_ORIGINS: "*"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemini-3.6-flash}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==============================================================================
  # FRONTEND CLIENT: React + Vite + Tailwind CSS SPA
  # ==============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: travel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # ==============================================================================
  # API GATEWAY: NGINX Reverse Proxy & Rate Limiter
  # ==============================================================================
  nginx:
    image: nginx:alpine
    container_name: travel_api_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:

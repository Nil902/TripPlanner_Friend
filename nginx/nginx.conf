# NGINX API Gateway Configuration
# Serves as the single unified entrypoint matching systemArchitectureImage.jpg

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging settings
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # Rate Limiting Zone: Protects against expensive LLM and Places API generation abuse
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;

    # Upstream Definitions
    upstream backend_api {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_spa {
        server frontend:80;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Client body limit for expense receipts / payloads
        client_max_body_size 16M;

        # 1. API Endpoints (Reverse proxy to FastAPI backend)
        location /api/ {
            limit_req zone=api_rate_limit burst=25 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for longer agent loop generation calls
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 2. Healthcheck endpoint
        location /healthz {
            proxy_pass http://backend_api/healthz;
            proxy_set_header Host $host;
        }

        # 3. Interactive API Documentation
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_set_header Host $host;
        }

        # 4. Frontend Client (React SPA)
        location / {
            proxy_pass http://frontend_spa;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

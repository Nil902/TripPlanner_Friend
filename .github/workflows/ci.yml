name: Production checks

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend lint, types, tests and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-prod.txt
      - run: python -m pip install -r requirements.txt
      - run: ruff check . && ruff format --check .
      - run: mypy app
      - run: pytest -v
      - run: pip-audit --strict -r requirements-prod.txt

  frontend-verification:
    name: Frontend lint, types, tests, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  production-container:
    name: PostgreSQL migrations and production container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tripplanner_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tripplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripplanner_test -d tripplanner_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # These credentials are only for this job's disposable service container.
      DATABASE_URL: postgresql://tripplanner_test:ci-only-password@127.0.0.1:5432/tripplanner_test
      SECRET_KEY: ci-only-signing-key-never-use-in-production
      CORS_ORIGINS: ""
      ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-prod.txt
      - name: Upgrade a fresh PostgreSQL database and check schema parity
        working-directory: backend
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic check
      - run: docker build --tag tripplanner-ci .
      - name: Start the production image against PostgreSQL
        run: >-
          docker run --detach --name tripplanner-ci --network host
          --env DATABASE_URL --env SECRET_KEY --env CORS_ORIGINS --env ENVIRONMENT tripplanner-ci
      - name: Verify readiness, SPA routes, assets and public-access protection
        run: python scripts/smoke_deployment.py http://127.0.0.1:8000 --require-auth
      - name: Verify authenticated writes against disposable PostgreSQL
        run: python scripts/exercise_api.py http://127.0.0.1:8000
      - name: Container logs on failure
        if: failure()
        run: docker logs tripplanner-ci
      - name: Stop the test container
        if: always()
        run: docker rm --force tripplanner-ci
